<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8">
<title>شفتاتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#F2F4F8;--sf:#fff;--ink:#10182B;--mu:#5B667A;--ln:#DCE1EA;--ac:#2B4EFF;--on:#fff;--tdy:#E3E9FF;color-scheme:light}
[data-theme=dark]{--bg:#0A0E1A;--sf:#131A2B;--ink:#EAEEFA;--mu:#8E9AB3;--ln:#243049;--ac:#8097FF;--on:#0A0E1A;--tdy:#1C2850;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Readex Pro","Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18px) 0 14px}
.top h1{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.top p{margin:2px 0 0;font-size:13px;color:var(--mu)}
.acts{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;display:grid;place-items:center}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.verse{border-radius:24px;padding:26px 22px 20px;text-align:center;color:#F3E7C1;background:radial-gradient(circle at 12% 0,rgba(233,196,106,.2),transparent 55%),linear-gradient(150deg,#0F4B43,#0B2F3C);box-shadow:inset 0 0 0 1px rgba(233,196,106,.28)}
.vt{margin:0;font:400 25px/2.1 "Amiri Quran","Traditional Arabic",serif}
.vr{margin:6px 0 0;font-size:13px;opacity:.78}
section{margin-top:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px 16px}
.nx{display:flex;align-items:center;gap:12px}
.nx .dot{width:12px;height:36px;border-radius:6px;background:var(--c)}
.nx b{display:block;font-size:17px}.nx span{font-size:13px;color:var(--mu)}
.nx .tag{margin-inline-start:auto;text-align:end}
.pl{border-inline-start:6px solid var(--c);margin-top:10px}
.pl h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl h3 small{font-size:12px;font-weight:400;color:var(--mu)}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr>div+div{border-inline-start:1px solid var(--ln);padding-inline-start:12px}
.pr .lb{display:block;font-size:12px;color:var(--mu)}
.pr .big{display:block;font-size:30px;font-weight:700;line-height:1.2}
.pr .rg{display:block;font-size:12px;color:var(--mu)}
.pr .bd{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bd i{font-style:normal;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--bg)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h2{margin:0;font-size:17px}
.nav{width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);cursor:pointer;font-size:20px;line-height:1}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:11px;color:var(--mu);padding-bottom:6px}
.cell{min-height:60px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);padding:4px 3px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:center}
.cell.bl{border:0;background:none;cursor:default}
.cell .n{font-size:13px;font-weight:600}
.cell.td{background:var(--tdy);border-color:var(--ac)}
.cell.td .n{background:var(--ac);color:var(--on);border-radius:99px;width:24px;height:24px;line-height:24px;margin:0 auto}
.cell.ps{opacity:.55}
.pill{display:block;font-style:normal;font-size:11px;font-weight:700;line-height:1.45;border-radius:5px;padding:0 3px;background:color-mix(in srgb,var(--c) 30%,var(--sf));border-inline-start:3px solid var(--c)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 0;font-size:12px;color:var(--mu)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.btn{min-height:46px;border-radius:12px;padding:0 16px;font-weight:600;cursor:pointer;border:1px solid var(--ln);background:var(--bg);width:100%;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.btn.dn{background:var(--ink);color:var(--bg);border-color:var(--ink);margin-top:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:10}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:11;max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--sf);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.grip{width:40px;height:4px;border-radius:4px;background:var(--ln);margin:0 auto 14px}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet h3{margin:16px 0 8px;font-size:14px}
.grp h4{margin:12px 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.grp h4 i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opts button{min-height:52px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;line-height:1.3;padding:0 2px}
.opts button small{font-weight:400;font-size:10px;color:var(--mu)}
.opts button.sel{background:color-mix(in srgb,var(--c) 32%,var(--sf));border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.pe{border:1px solid var(--ln);border-inline-start:6px solid var(--c);border-radius:14px;padding:12px;margin-bottom:10px}
.pe-h{display:flex;gap:8px}
.pe input.nm,.pe select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);padding:0 12px}
.rm{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);cursor:pointer;font-size:20px}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sw{width:30px;height:30px;border-radius:50%;border:0;background:var(--k);cursor:pointer}
.sw.sel{box-shadow:0 0 0 2px var(--sf),0 0 0 4px var(--k)}
.cust{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;background:conic-gradient(#f43,#fb0,#4c4,#2bf,#84f,#f43);cursor:pointer}
.cust input{position:absolute;inset:-8px;width:48px;height:48px;opacity:0;cursor:pointer}
.msg{margin:10px 0 0;font-size:13px;color:var(--mu);min-height:1.2em}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>شفتاتي</h1><p id="dl"></p></div>
    <div class="acts">
      <button class="ib" id="tgl" type="button" aria-label="تبديل الوضع"></button>
      <button class="ib" id="todayBtn" type="button" aria-label="اليوم"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
      <button class="ib" id="gear" type="button" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>
  <section class="verse" style="margin-top:0" aria-label="آية اليوم"><p class="vt" id="vt"></p><p class="vr" id="vr"></p></section>
  <section class="card" id="next" aria-live="polite"></section>
  <section id="tot"></section>
  <section class="card">
    <div class="ch"><button class="nav" id="prev" type="button" aria-label="الشهر اللي قبله">›</button><h2 id="mt"></h2><button class="nav" id="nxt" type="button" aria-label="الشهر الجاي">‹</button></div>
    <div class="wk" id="wk"></div><div class="days" id="days"></div>
    <div class="lg" id="lg"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="daySheet" role="dialog" aria-modal="true" hidden>
  <div class="grip"></div><h2 id="dt"></h2><div id="db"></div>
  <button class="btn dn" id="dd" type="button">تم</button>
</div>
<div class="sheet" id="setSheet" role="dialog" aria-modal="true" hidden>
  <div class="grip"></div><h2>الإعدادات</h2>
  <h3>الأماكن</h3>
  <div id="pls"></div>
  <button class="btn pri" id="add" type="button">إضافة مكان</button>
  <h3>ملف Excel</h3>
  <div class="r2">
    <button class="btn" id="exp" type="button">تصدير الشهر المعروض</button>
    <label class="btn" style="cursor:pointer">استيراد ملف<input class="sr" type="file" id="file" accept=".xlsx"></label>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <button class="btn dn" id="sd" type="button">تم</button>
</div>

<script>
(function(){
const KEY="shefati-v2",OLD="shefati-empty-v1";
const PAL=["#E4572E","#17BEBB","#FFB000","#5BB450","#8E5CF7","#E8478B","#2F80ED","#F2711C","#00A98F","#7A869A"];
const SH={D:"نهار",N:"سهر",DN:"نبطشية",M:"M"},CODES=Object.keys(SH);
const SYSL={cal:"شهر عادي (١ لآخر الشهر)",mid:"من ١٦ لـ ١٥ الشهر الجاي"},SYSS={cal:"شهر عادي",mid:"١٦ ← ١٥"};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const VERSES=[["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا","الشرح ٥–٦"],["وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ","الطلاق ٣"],["أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ","الرعد ٢٨"],["وَقُل رَّبِّ زِدْنِي عِلْمًا","طه ١١٤"],["لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا","البقرة ٢٨٦"],["فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ","البقرة ١٥٢"],["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","الضحى ٥"],["إِنَّ اللَّهَ مَعَ الصَّابِرِينَ","البقرة ١٥٣"],["وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا","الطلاق ٢"],["رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","البقرة ٢٠١"],["وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ","النحل ١٢٧"],["وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ","هود ٨٨"],["وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ","غافر ٦٠"],["سَيَجْعَلُ اللَّهُ بَعْدَ عُسْرٍ يُسْرًا","الطلاق ٧"],["وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ","البقرة ٢١٦"],["وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ","آل عمران ١٣٩"],["وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا","المائدة ٣٢"],["وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ","الشعراء ٨٠"],["وَاللَّهُ يَرْزُقُ مَن يَشَاءُ بِغَيْرِ حِسَابٍ","البقرة ٢١٢"],["فَاصْبِرْ صَبْرًا جَمِيلًا","المعارج ٥"],["وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ","الأعراف ١٥٦"],["وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ","الحديد ٤"],["إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ","الأعراف ٥٦"],["وَاللَّهُ غَالِبٌ عَلَىٰ أَمْرِهِ","يوسف ٢١"]];
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fW=new Intl.DateTimeFormat("ar-EG",{weekday:"long"}),fWn=new Intl.DateTimeFormat("ar-EG",{weekday:"narrow"}),fD=new Intl.DateTimeFormat("ar-EG",{day:"numeric",month:"long"}),fM=new Intl.DateTimeFormat("ar-EG",{month:"long",year:"numeric"});
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const s=JSON.parse(r);if(s&&Array.isArray(s.places))return s}
    const o=JSON.parse(localStorage.getItem(OLD)||"null");
    if(o&&o.abasaya&&o.celopatera)return{places:[{id:"p1",name:o.abasaya.name,color:PAL[0],sys:"cal"},{id:"p2",name:o.celopatera.name,color:PAL[1],sys:"mid"}],shifts:{p1:o.abasaya.shifts||{},p2:o.celopatera.shifts||{}}};
  }catch(e){}
  return{places:[{id:"p1",name:"العباسية",color:PAL[0],sys:"cal"},{id:"p2",name:"كليوباترا",color:PAL[1],sys:"mid"}],shifts:{p1:{},p2:{}}};
}
let state=load(),viewMonth,editKey=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const say=t=>{$("msg").textContent=t};

/* Periods: "mid" runs 16th to 15th of next month, "cal" is the calendar month */
const per=(sys,y,m)=>sys==="mid"?[new Date(y,m,16),new Date(y,m+1,15)]:[new Date(y,m,1),new Date(y,m+1,0)];
const curStart=(sys,t)=>sys==="mid"&&t.getDate()<16?[t.getFullYear(),t.getMonth()-1]:[t.getFullYear(),t.getMonth()];
function count(id,r){
  const a=keyOf(r[0]),b=keyOf(r[1]),c={D:0,N:0,DN:0,M:0},s=state.shifts[id]||{};
  for(const k in s)if(k>=a&&k<=b&&c[s[k]]!==undefined)c[s[k]]++;
  c.total=c.D+c.N+2*c.DN;return c;
}

/* Theme */
function applyTheme(){
  const t=state.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  document.documentElement.dataset.theme=t;
  $("tgl").innerHTML=t==="dark"?SUN:MOON;
  document.querySelector("meta[name=theme-color]").content=t==="dark"?"#0A0E1A":"#F2F4F8";
}

/* Render */
function renderVerse(){
  const t=today(),di=Math.floor(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5);
  const v=VERSES[((di*2654435761)>>>0)%VERSES.length];
  $("vt").textContent="﴿ "+v[0]+" ﴾";$("vr").textContent=v[1];
  $("dl").textContent=fW.format(t)+" "+fD.format(t);
}
function renderNext(){
  const t=today();let best=null;
  state.places.forEach(p=>{const s=state.shifts[p.id]||{};for(const k in s){const d=parseKey(k);if(s[k]&&d>=t&&(!best||d<best.d))best={p,d,v:s[k]}}});
  if(!best){$("next").innerHTML='<span style="color:var(--mu)">مفيش شيفتات جاية في الجدول</span>';return}
  const n=Math.round((best.d-t)/864e5),w=n===0?"النهارده":n===1?"بكرة":"بعد "+n+" يوم";
  $("next").innerHTML='<div class="nx" style="--c:'+best.p.color+'"><span class="dot"></span><div><span>الشيفت الجاي في '+esc(best.p.name)+'</span><b>'+fW.format(best.d)+" "+fD.format(best.d)+'</b></div><div class="tag"><b>'+best.v+'</b><span>'+w+'</span></div></div>';
}
function renderTot(){
  const t=today();
  $("tot").innerHTML=state.places.map(p=>{
    const s=curStart(p.sys,t);
    const cols=[0,1].map(i=>{
      const r=per(p.sys,s[0],s[1]+i),c=count(p.id,r);
      return '<div><span class="lb">'+(i?"الفترة الجاية":"الفترة الحالية")+'</span><b class="big">'+c.total+'</b><span class="rg">'+fD.format(r[0])+" – "+fD.format(r[1])+'</span><span class="bd"><i>D '+c.D+'</i><i>N '+c.N+'</i><i>DN '+c.DN+'</i><i>M '+c.M+'</i></span></div>';
    }).join("");
    return '<article class="card pl" style="--c:'+p.color+'"><h3>'+esc(p.name)+'<small>'+SYSS[p.sys]+'</small></h3><div class="pr">'+cols+'</div></article>';
  }).join("")||'<div class="card" style="color:var(--mu)">ضيف أول مكان من الإعدادات</div>';
}
function renderCal(){
  const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),t=today();
  $("mt").textContent=fM.format(viewMonth);
  if(!$("wk").children.length)$("wk").innerHTML=[0,1,2,3,4,5,6].map(i=>"<span>"+fWn.format(new Date(2024,0,7+i))+"</span>").join("");
  let h="";
  for(let i=0;i<new Date(y,m,1).getDay();i++)h+='<div class="cell bl" aria-hidden="true"></div>';
  for(let d=1,n=new Date(y,m+1,0).getDate();d<=n;d++){
    const dt=new Date(y,m,d),k=keyOf(dt),tdy=dt.getTime()===t.getTime();
    const pills=state.places.map(p=>{const v=(state.shifts[p.id]||{})[k];return v?'<i class="pill" style="--c:'+p.color+'">'+v+"</i>":""}).join("");
    h+='<button type="button" class="cell'+(tdy?" td":"")+(dt<t?" ps":"")+'" data-k="'+k+'" aria-label="'+fD.format(dt)+'"><span class="n">'+d+"</span>"+pills+"</button>";
  }
  $("days").innerHTML=h;
}
function renderLg(){
  $("lg").innerHTML=state.places.map(p=>'<span style="--c:'+p.color+'"><i></i>'+esc(p.name)+"</span>").join("")+CODES.map(c=>"<span>"+c+" = "+SH[c]+"</span>").join("");
}
const renderAll=()=>{renderNext();renderTot();renderCal();renderLg()};

/* Sheets */
function show(id){$("scrim").hidden=false;$(id).hidden=false}
function closeAll(){["scrim","daySheet","setSheet"].forEach(i=>$(i).hidden=true);editKey=null}
function renderDay(){
  $("db").innerHTML=state.places.map(p=>{
    const cur=(state.shifts[p.id]||{})[editKey]||"";
    const b=[["","راحة"]].concat(CODES.map(c=>[c,SH[c]])).map(o=>'<button type="button" data-p="'+p.id+'" data-v="'+o[0]+'" class="'+(o[0]===cur?"sel":"")+'">'+(o[0]||"–")+"<small>"+o[1]+"</small></button>").join("");
    return '<div class="grp" style="--c:'+p.color+'"><h4><i></i>'+esc(p.name)+'</h4><div class="opts">'+b+"</div></div>";
  }).join("");
}
function renderSet(){
  $("pls").innerHTML=state.places.map(p=>
    '<div class="pe" data-id="'+p.id+'" style="--c:'+p.color+'"><div class="pe-h"><input class="nm" value="'+esc(p.name)+'" maxlength="30" aria-label="اسم المكان"><button class="rm" type="button" aria-label="حذف المكان">×</button></div>'+
    '<div class="sws">'+PAL.map(c=>'<button type="button" class="sw'+(c===p.color?" sel":"")+'" data-c="'+c+'" style="--k:'+c+'" aria-label="لون"></button>').join("")+'<label class="cust" aria-label="لون مخصص"><input type="color" value="'+p.color+'"></label></div>'+
    '<select class="sys" aria-label="نظام الحساب">'+Object.keys(SYSL).map(k=>'<option value="'+k+'"'+(k===p.sys?" selected":"")+">"+SYSL[k]+"</option>").join("")+"</select></div>"
  ).join("");
}
const place=id=>state.places.find(p=>p.id===id);

/* Excel */
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255};
async function exportX(){
  if(!window.ExcelJS)return say("مكتبة Excel ما اتحملتش. اتأكد من النت وجرب تاني.");
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Roster");
  const th={style:"thin",color:{argb:"FFBFBFBF"}},bd={top:th,left:th,bottom:th,right:th},ct={horizontal:"center",vertical:"middle"};
  const fill=a=>({type:"pattern",pattern:"solid",fgColor:{argb:a}});
  const CF={D:"FFFFF2CC",N:"FFDDEBF7",DN:"FFE2EFDA",M:"FFEDEDED"},N=31,R0=5,SR=R0+N+1;
  ws.getCell("A1").value="Roster - شفتاتي";ws.getCell("A1").font={name:"Arial",bold:true,size:14};
  state.places.forEach((p,i)=>{
    const c0=1+i*4,L=k=>ws.getColumn(c0+k).letter,r=per(p.sys,viewMonth.getFullYear(),viewMonth.getMonth()),sh=state.shifts[p.id]||{};
    ws.mergeCells(3,c0,3,c0+2);
    const t=ws.getCell(3,c0);t.value=p.name+" ("+SYSL[p.sys]+")";t.fill=fill("FF"+p.color.slice(1).toUpperCase());t.font={name:"Arial",bold:true,color:{argb:lum(p.color)>.6?"FF000000":"FFFFFFFF"}};t.alignment=ct;
    ["التاريخ","Day",p.name].forEach((h,k)=>{const c=ws.getCell(4,c0+k);c.value=h;c.font={name:"Arial",bold:true,color:{argb:"FFFFFFFF"}};c.fill=fill("FF1F4E78");c.alignment=ct;c.border=bd});
    const cnt={D:0,N:0,DN:0,M:0};
    for(let j=0;j<N;j++){
      const d=new Date(r[0].getFullYear(),r[0].getMonth(),r[0].getDate()+j);if(d>r[1])break;
      const rw=R0+j,v=sh[keyOf(d)]||"";if(cnt[v]!==undefined)cnt[v]++;
      const a=ws.getCell(rw,c0),b=ws.getCell(rw,c0+1),s=ws.getCell(rw,c0+2);
      a.value=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));a.numFmt="dd/mm";
      b.value={formula:"TEXT("+L(0)+rw+',"DDD")',result:DOW[d.getDay()]};
      s.value=v||null;s.dataValidation={type:"list",allowBlank:true,formulae:['"D,N,DN,M"']};
      [a,b,s].forEach(c=>{c.border=bd;c.alignment=ct;c.font={name:"Arial",bold:c===a}});
    }
    const rng=L(2)+R0+":"+L(2)+(R0+N-1);
    ws.addConditionalFormatting({ref:rng,rules:CODES.map(k=>({type:"cellIs",operator:"equal",formulae:['"'+k+'"'],style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:CF[k]}}}}))});
    ws.getCell(SR,c0).value="الإجمالي";ws.getCell(SR,c0).font={name:"Arial",bold:true};
    CODES.forEach((k,j)=>{ws.getCell(SR+1+j,c0).value=k;ws.getCell(SR+1+j,c0+2).value={formula:"COUNTIF("+rng+',"'+k+'")',result:cnt[k]}});
    ws.getCell(SR+5,c0).value="Total (DN=2)";
    ws.getCell(SR+5,c0+2).value={formula:L(2)+(SR+1)+"+"+L(2)+(SR+2)+"+2*"+L(2)+(SR+3),result:cnt.D+cnt.N+2*cnt.DN};
    for(let rw=SR+1;rw<=SR+5;rw++)for(let k=0;k<3;k++){const c=ws.getCell(rw,c0+k);c.border=bd;c.alignment=ct;c.font={name:"Arial",bold:k===0}}
    [12,8,16,3].forEach((w,k)=>ws.getColumn(c0+k).width=w);
  });
  ws.views=[{state:"frozen",ySplit:4}];
  const blob=new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="roster-"+viewMonth.getFullYear()+"-"+pad(viewMonth.getMonth()+1)+".xlsx";a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);say("تم تصدير الملف.");
}
const cellVal=c=>{let v=c.value;if(v&&typeof v==="object"&&!(v instanceof Date)){v="result" in v?v.result:v.richText?v.richText.map(t=>t.text).join(""):null}return v};
const cellTxt=c=>{const v=cellVal(c);return typeof v==="string"?v.trim():""};
function cellDate(c){
  const v=cellVal(c);
  if(v instanceof Date)return new Date(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate());
  if(typeof v==="number"&&v>40000&&v<60000){const u=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5);return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())}
  return null;
}
function normShift(s){
  const t=s.replace(/[\s+\/\-]/g,"").toUpperCase();
  return{D:"D",N:"N",DN:"DN",ND:"DN",M:"M","نهار":"D","سهر":"N","ليل":"N","نبطشية":"DN"}[t]||"";
}
async function importX(f){
  if(!window.ExcelJS)return say("مكتبة Excel ما اتحملتش. اتأكد من النت وجرب تاني.");
  try{
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
    const blocks=[];
    wb.eachSheet(ws=>ws.eachRow((row,r)=>row.eachCell((cell,c)=>{
      if(cellTxt(cell)!=="التاريخ")return;
      const name=cellTxt(ws.getCell(r,c+2));if(!name)return;
      const sh={},keys=[];
      for(let rr=r+1;;rr++){const d=cellDate(ws.getCell(rr,c));if(!d)break;const k=keyOf(d);keys.push(k);const v=normShift(cellTxt(ws.getCell(rr,c+2)));if(v)sh[k]=v}
      if(keys.length)blocks.push({name,sh,keys:keys.sort()});
    })));
    if(!blocks.length)return say("ما لقيتش جداول في الملف. استخدم ملف متصدّر من الموقع.");
    const sum=blocks.map(b=>b.name+": "+Object.keys(b.sh).length+" شيفت").join("\n");
    if(!confirm("استيراد الجداول دي؟ الأيام الموجودة في الملف هتحل محل القديمة.\n\n"+sum))return;
    blocks.forEach(b=>{
      let p=state.places.find(x=>x.name.trim().toLowerCase()===b.name.toLowerCase());
      if(!p){p={id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:b.name,color:PAL[state.places.length%PAL.length],sys:parseKey(b.keys[0]).getDate()===16?"mid":"cal"};state.places.push(p)}
      const cur=state.shifts[p.id]||{},lo=b.keys[0],hi=b.keys[b.keys.length-1];
      for(const k in cur)if(k>=lo&&k<=hi)delete cur[k];
      state.shifts[p.id]=Object.assign(cur,b.sh);
    });
    save();renderAll();renderSet();say("تم الاستيراد.");
  }catch(e){say("ما قدرتش أقرأ الملف. اتأكد إنه .xlsx سليم.")}
}

/* Events */
$("days").addEventListener("click",e=>{
  const c=e.target.closest(".cell[data-k]");if(!c)return;
  editKey=c.dataset.k;const d=parseKey(editKey);
  $("dt").textContent=fW.format(d)+" "+fD.format(d);renderDay();show("daySheet");
});
$("db").addEventListener("click",e=>{
  const b=e.target.closest("button[data-p]");if(!b||!editKey)return;
  const s=state.shifts[b.dataset.p]||(state.shifts[b.dataset.p]={});
  if(b.dataset.v)s[editKey]=b.dataset.v;else delete s[editKey];
  save();renderDay();renderAll();
});
$("pls").addEventListener("input",e=>{
  const pe=e.target.closest(".pe"),p=pe&&place(pe.dataset.id);if(!p)return;
  if(e.target.classList.contains("nm"))p.name=e.target.value||"مكان";
  else if(e.target.type==="color"){p.color=e.target.value;pe.style.setProperty("--c",p.color)}
  save();renderAll();
});
$("pls").addEventListener("change",e=>{
  const pe=e.target.closest(".pe"),p=pe&&place(pe.dataset.id);
  if(p&&e.target.classList.contains("sys")){p.sys=e.target.value;save();renderAll()}
});
$("pls").addEventListener("click",e=>{
  const pe=e.target.closest(".pe"),p=pe&&place(pe.dataset.id);if(!p)return;
  const sw=e.target.closest(".sw");
  if(sw){p.color=sw.dataset.c;save();renderSet();renderAll()}
  else if(e.target.closest(".rm")&&confirm("حذف «"+p.name+"» وكل شيفتاته؟")){
    state.places=state.places.filter(x=>x!==p);delete state.shifts[p.id];save();renderSet();renderAll();
  }
});
$("add").addEventListener("click",()=>{
  const id="p"+Date.now().toString(36);
  state.places.push({id,name:"مكان جديد",color:PAL[state.places.length%PAL.length],sys:"cal"});state.shifts[id]={};
  save();renderSet();renderAll();
});
$("gear").addEventListener("click",()=>{say("");renderSet();show("setSheet")});
$("exp").addEventListener("click",exportX);
$("file").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importX(f)});
["dd","sd","scrim"].forEach(i=>$(i).addEventListener("click",closeAll));
$("tgl").addEventListener("click",()=>{state.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();applyTheme()});
$("prev").addEventListener("click",()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);renderCal()});
$("nxt").addEventListener("click",()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);renderCal()});
$("todayBtn").addEventListener("click",()=>{const t=today();viewMonth=new Date(t.getFullYear(),t.getMonth(),1);renderCal()});

const t0=today();viewMonth=new Date(t0.getFullYear(),t0.getMonth(),1);
applyTheme();renderVerse();renderAll();
})();
</script>
