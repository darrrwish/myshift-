<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6F6A">
<title>شفتاتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #EEF2F1;
    --surface: #FFFFFF;
    --ink: #14302F;
    --muted: #5E716F;
    --faint: #93A5A2;
    --line: #D6E0DE;
    --brand: #2E6F6A;
    --brand-deep: #1F524E;
    --aba-tint: #F3E8D6;
    --aba-strong: #B07D4A;
    --cel-tint: #D4F4EF;
    --cel-strong: #1FA89A;
    --day: #E8C47E;
    --day-ink: #4A3300;
    --night: #26295A;
    --today: #DDF1EE;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1716;
      --surface: #142120;
      --ink: #E4EFEC;
      --muted: #9AB0AC;
      --faint: #5C716E;
      --line: #22342F;
      --brand: #2E6F6A;
      --brand-deep: #163F3C;
      --aba-tint: #3A2E20;
      --aba-strong: #D9A56E;
      --cel-tint: #15322F;
      --cel-strong: #4FD1C0;
      --day: #C9A35A;
      --day-ink: #241A00;
      --night: #3B3F80;
      --today: #1B3A37;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; }

  /* Header */
  .hdr {
    background: var(--brand);
    color: #FFFFFF;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 52px;
    border-radius: 0 0 28px 28px;
  }
  .hdr-in { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .hdr h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; }
  .hdr p { margin: 4px 0 0; font-size: 14px; opacity: .85; }
  .gear {
    width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.12); cursor: pointer; display: grid; place-items: center; color: #FFFFFF;
  }
  .gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .hbtns { display: flex; align-items: center; gap: 8px; }
  .today {
    height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.12); color: #FFFFFF; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; font-weight: 600; font-size: 14px;
  }
  .today svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  .app { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }

  /* Next shift */
  .next {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px 18px; margin-top: -30px; position: relative;
    box-shadow: 0 6px 20px rgba(20, 48, 47, .08);
  }
  .next .kicker { margin: 0; font-size: 13px; color: var(--muted); }
  .next .main { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
  .next .wd { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; }
  .next .dd { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
  .next .side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .next .when { font-size: 13px; color: var(--muted); }
  .next .empty { margin: 0; }
  .chip {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 700; background: #FFFFFF; color: var(--ink); box-shadow: 0 0 0 1px var(--line);
  }
  .chip.d { background: var(--day); color: var(--day-ink); box-shadow: none; }
  .chip.n { background: var(--night); color: #FFFFFF; box-shadow: none; }
  .chip.dn { background: linear-gradient(to left, var(--day) 50%, var(--night) 50%); color: #FFFFFF; box-shadow: none; text-shadow: 0 0 4px rgba(0,0,0,.35); }

  /* Stats */
  .stats {
    width: 100%; border-collapse: collapse; margin: 14px 0 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    font-size: 13px;
  }
  .stats th, .stats td { padding: 10px 4px; text-align: center; }
  .stats th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); }
  .stats td { font-weight: 700; font-size: 15px; }
  .stats td:first-child, .stats th:first-child { text-align: start; padding-inline-start: 12px; font-size: 13px; font-weight: 600; }
  .stats tr + tr td { border-top: 1px solid var(--line); }

  /* Calendar */
  .cal {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px; margin-top: 14px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .nav {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); cursor: pointer; font-size: 20px; line-height: 1;
  }
  .wk, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wk span { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 6px; font-weight: 600; }
  .cell {
    min-height: 58px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); padding: 5px 3px 4px; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: center;
  }
  .cell.blank { border: 0; background: transparent; cursor: default; }
  .cell .num { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .cell.today { background: var(--today); border-color: var(--brand); }
  .cell.today .num {
    background: var(--ink); color: var(--bg);
    border-radius: 999px; width: 26px; height: 26px; line-height: 26px; margin: 0 auto;
  }
  .cell.past { opacity: .55; }
  .slot { display: block; border-radius: 6px; padding: 3px; }
  .slot.a { background: var(--aba-tint); }
  .slot.c { background: var(--cel-tint); }
  .pill {
    display: block; background: var(--surface); color: var(--ink);
    border-radius: 5px; padding: 2px 3px; font-size: 11px; font-weight: 700; line-height: 1.3;
    border-inline-start: 3px solid;
  }
  .pill.a { border-inline-start-color: var(--aba-strong); }
  .pill.c { border-inline-start-color: transparent; }
  .pill.d { background: var(--day); color: var(--day-ink); }
  .pill.n { background: var(--night); color: #FFFFFF; }
  .pill.dn { background: linear-gradient(to left, var(--day) 50%, var(--night) 50%); color: #FFFFFF; text-shadow: 0 0 3px rgba(0,0,0,.45); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 12px 4px 0;
    font-size: 12px; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; }

  /* Buttons */
  .btn {
    min-height: 46px; border-radius: 12px; padding: 0 16px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; width: 100%;
  }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }
  .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

  .set-sec { margin-bottom: 6px; }
  .set-sec h3 { margin: 0 0 4px; font-size: 15px; }
  .set-sec p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .preview { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .preview p { margin: 0 0 6px; }
  .fld { display: block; margin-bottom: 10px; }
  .fld span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .fld input {
    width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; padding: 0 12px;
  }
  #saveNames { width: 100%; margin-bottom: 4px; }
  .msg { margin: 10px 0 0; font-size: 13px; color: var(--muted); min-height: 1em; }

  /* Sheets */
  .scrim { position: fixed; inset: 0; background: rgba(10, 20, 20, .4); z-index: 10; }
  .sheet {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 11;
    max-width: 480px; margin: 0 auto; max-height: 85vh; overflow-y: auto;
    background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .15);
  }
  .grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
  .grp { margin-bottom: 14px; }
  .grp h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opts button {
    min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); padding: 0 12px; display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .opts button .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .opts button.sel { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .sheet .done { margin-top: 14px; background: var(--ink); color: var(--bg); border-color: var(--ink); }

  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <div>
      <h1>شفتاتي</h1>
      <p>بادر الصيد مع الفجر...فمن بادر الصيد مع الفجر قنص</p>
    </div>
    <div class="hbtns">
    <button class="today" id="todayBtn" type="button" aria-label="اليوم">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/><circle cx="12" cy="15" r="1.5" fill="currentColor"/></svg>
      <span>اليوم</span>
    </button>
    <button class="gear" id="openSettings" type="button" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
    </div>
  </div>
</header>

<main class="app">
  <section class="next" id="next" aria-live="polite"></section>

  <table class="stats" id="stats" aria-label="إجمالي الشيفتات"></table>

  <section class="cal" aria-label="التقويم">
    <div class="cal-head">
      <button class="nav" id="prev" type="button" aria-label="الشهر اللي قبله">›</button>
      <h2 id="monthTitle"></h2>
      <button class="nav" id="nextBtn" type="button" aria-label="الشهر الجاي">‹</button>
    </div>
    <div class="wk" id="wk"></div>
    <div class="days" id="days"></div>
    <div class="legend">
      <span><i style="background:var(--aba-tint);box-shadow:inset 0 0 0 2px var(--aba-strong)"></i><em id="lgA" style="font-style:normal">العباسية</em></span>
      <span><i style="background:var(--cel-tint);box-shadow:inset 0 0 0 2px var(--cel-strong)"></i><em id="lgC" style="font-style:normal">كليوباترا</em></span>
      <span><i style="background:var(--day)"></i>D = نهار</span>
      <span><i style="background:var(--night)"></i>N = ليل</span>
      <span><i style="background:linear-gradient(to left,var(--day) 50%,var(--night) 50%)"></i>DN = نهار وليل</span>
    </div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="daySheet" role="dialog" aria-modal="true" aria-labelledby="dayTitle" hidden>
  <div class="grip"></div>
  <h2 id="dayTitle"></h2>
  <div id="dayBody"></div>
  <button class="btn done" id="dayDone" type="button">تم</button>
</div>

<div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <div class="grip"></div>
  <h2 id="setTitle">الإعدادات</h2>
  <section class="set-sec">
    <h3>أسماء الأماكن</h3>
    <p>الاسم اللي هيظهر في الصفحة كلها.</p>
    <label class="fld"><span>المكان الأول (الشريط الأول)</span><input type="text" id="nameA" maxlength="30"></label>
    <label class="fld"><span>المكان التاني (الشريط التاني)</span><input type="text" id="nameC" maxlength="30"></label>
    <button class="btn primary" id="saveNames" type="button">حفظ الأسماء</button>
  </section>
  <section class="set-sec">
    <h3>رفع ملف جدول</h3>
    <p>ملف Excel أو CSV بنفس شكل الروستر. الجدول الجديد هيحل محل القديم.</p>
    <label class="btn" style="cursor:pointer">
      اختار الملف
      <input class="sr" type="file" id="file" accept=".xlsx,.xls,.csv">
    </label>
    <div class="preview" id="preview" hidden>
      <div id="previewBody"></div>
      <div class="row-btns">
        <button class="btn" id="cancelUp" type="button">إلغاء</button>
        <button class="btn primary" id="applyUp" type="button">استخدم الجدول ده</button>
      </div>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>
  <button class="btn done" id="setDone" type="button">تم</button>
</div>

<script>
(function () {
  const SEED = {
    abasaya: { name: "العباسية", period: [], shifts: {} },
    celopatera: { name: "كليوباترا", period: [], shifts: {} }
  };

  const KEY = "shefati-empty-v1";
  const LOCS = ["abasaya", "celopatera"];
  const CLS = { D: "d", N: "n", DN: "dn" };
  const SWATCH = { D: "var(--day)", N: "var(--night)", DN: "linear-gradient(to left,var(--day) 50%,var(--night) 50%)" };
  const OPTIONS = [["", "راحة"], ["D", "D"], ["N", "N"], ["DN", "DN"]];

  const fWeekday  = new Intl.DateTimeFormat("ar-EG", { weekday: "long" });
  const fWeekdayS = new Intl.DateTimeFormat("ar-EG", { weekday: "narrow" });
  const fDayMonth = new Intl.DateTimeFormat("ar-EG", { day: "numeric", month: "long" });
  const fMonth    = new Intl.DateTimeFormat("ar-EG", { month: "long", year: "numeric" });

  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseKey = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const clone = o => JSON.parse(JSON.stringify(o));

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.abasaya && s.celopatera) return s;
      }
    } catch (e) { /* fall back to roster */ }
    return clone(SEED);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  let state = load();
  let editKey = null;
  let viewMonth = null;
  let pending = null;

  /* ---------- Shift helpers ---------- */

  function shiftOf(v) {
    if (typeof v !== "string") return null;
    const t = v.replace(/[\s+\/\-]/g, "").toUpperCase();
    if (!t) return null;
    if (["DN", "ND", "نل", "لن", "نهارليل", "ليلنهار"].includes(t)) return "DN";
    if (["D", "ن", "نهار", "DAY"].includes(t)) return "D";
    if (["N", "ل", "ليل", "NIGHT"].includes(t)) return "N";
    return null;
  }

  function serialToDate(n) {
    const u = new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000);
    return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate());
  }

  function toDate(v) {
    let d = null;
    if (typeof v === "number" && v > 40000 && v < 60000) {
      d = serialToDate(v);
    } else if (typeof v === "string") {
      const s = v.trim();
      if (/^\d{5}(\.\d+)?$/.test(s)) d = serialToDate(Number(s));
      else if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
        const p = s.slice(0, 10).split("-").map(Number); d = new Date(p[0], p[1] - 1, p[2]);
      } else if (/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{4}$/.test(s)) {
        const p = s.split(/[\/.\-]/).map(Number); d = new Date(p[2], p[1] - 1, p[0]);
      }
    }
    if (!d || isNaN(d) || d.getFullYear() < 2020 || d.getFullYear() > 2040) return null;
    return d;
  }

  /* ---------- Parsing uploaded roster ---------- */

  function parseRows(rows, out) {
    const hdr = {};
    rows.forEach(r => r.forEach((cell, c) => {
      if (typeof cell !== "string") return;
      const s = cell.toLowerCase();
      if (hdr.abasaya === undefined && /abas|abbas|عباس/.test(s)) hdr.abasaya = c;
      if (hdr.celopatera === undefined && /celop|cleop|kleop|كليوب|كيلوب/.test(s)) hdr.celopatera = c;
    }));
    const bothHeaders = hdr.abasaya !== undefined && hdr.celopatera !== undefined;

    rows.forEach(r => {
      const found = [];
      r.forEach((cell, c) => {
        const d = toDate(cell);
        if (!d) return;
        const nxt = r[c + 1];
        const hasWeekday = typeof nxt === "string" && nxt.trim() !== "" && shiftOf(nxt) === null;
        let hasShiftCell = false, shift = "";
        for (let k = 1; k <= 3; k++) {
          const sv = shiftOf(r[c + k]);
          if (sv !== null) { shift = sv; hasShiftCell = true; break; }
        }
        if (!hasWeekday && !hasShiftCell) return;
        found.push({ c, key: keyOf(d), shift });
      });
      found.forEach((f, idx) => {
        let loc;
        if (bothHeaders) loc = f.c >= hdr.celopatera ? "celopatera" : "abasaya";
        else if (found.length === 2) loc = idx === 0 ? "abasaya" : "celopatera";
        else return;
        out[loc][f.key] = f.shift;
      });
    });
  }

  function parseWorkbook(wb) {
    const out = { abasaya: {}, celopatera: {} };
    wb.SheetNames.forEach(name => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: "" });
      parseRows(rows, out);
    });
    return out;
  }

  function summarize(map) {
    const keys = Object.keys(map).sort();
    const c = { D: 0, N: 0, DN: 0 };
    keys.forEach(k => { if (c[map[k]] !== undefined) c[map[k]]++; });
    return { keys, c, total: c.D + c.N + c.DN * 2 };
  }

  function fmtKey(k) { return fDayMonth.format(parseKey(k)); }

  function showPreview(parsed) {
    const body = LOCS.map(l => {
      const s = summarize(parsed[l]);
      if (!s.keys.length) return "<p><strong>" + state[l].name + ":</strong> ما لقيتش أيام في الملف ده، هيفضل الجدول القديم.</p>";
      return "<p><strong>" + state[l].name + ":</strong> من " + fmtKey(s.keys[0]) + " لحد " +
        fmtKey(s.keys[s.keys.length - 1]) + "، " + s.total + " شيفت (D " + s.c.D + ", N " + s.c.N +
        ", DN " + s.c.DN + ")</p>";
    }).join("");
    document.getElementById("previewBody").innerHTML = body;
    document.getElementById("preview").hidden = false;
  }

  function setMsg(t) { document.getElementById("msg").textContent = t; }

  /* ---------- Rendering ---------- */

  function nextShift() {
    const t = today();
    let best = null;
    LOCS.forEach(l => {
      Object.keys(state[l].shifts).forEach(k => {
        const s = state[l].shifts[k];
        const d = parseKey(k);
        if (s && d >= t && (!best || d < best.date)) best = { loc: l, date: d, shift: s };
      });
    });
    return best;
  }

  function renderNext() {
    const el = document.getElementById("next");
    const n = nextShift();
    if (!n) {
      el.innerHTML = '<p class="kicker empty">ما فيش شيفتات جاية في الجدول</p>';
      return;
    }
    const diff = Math.round((n.date - today()) / 86400000);
    const when = diff === 0 ? "النهارده" : diff === 1 ? "بكرة" : "بعد " + diff + " يوم";
    el.innerHTML =
      '<p class="kicker">الشيفت الجاي · ' + state[n.loc].name + '</p>' +
      '<div class="main">' +
        '<div>' +
          '<p class="wd">' + fWeekday.format(n.date) + '</p>' +
          '<p class="dd">' + fDayMonth.format(n.date) + '</p>' +
        '</div>' +
        '<div class="side">' +
          '<span class="chip ' + CLS[n.shift] + '">' + n.shift + '</span>' +
          '<span class="when">' + when + '</span>' +
        '</div>' +
      '</div>';
  }

  function renderStats() {
    let rows = "";
    LOCS.forEach(l => {
      const s = summarize(state[l].shifts);
      rows += "<tr><td>" + state[l].name + "</td><td>" + s.c.D + "</td><td>" + s.c.N + "</td><td>" +
        s.c.DN + "</td><td>" + s.total + "</td></tr>";
    });
    document.getElementById("stats").innerHTML =
      "<thead><tr><th>الموقع</th><th>D</th><th>N</th><th>DN</th><th>الإجمالي</th></tr></thead><tbody>" +
      rows + "</tbody>";
  }

  function renderCal() {
    const y = viewMonth.getFullYear();
    const m = viewMonth.getMonth();
    document.getElementById("monthTitle").textContent = fMonth.format(viewMonth);

    const wk = document.getElementById("wk");
    if (!wk.children.length) {
      let h = "";
      for (let i = 0; i < 7; i++) h += "<span>" + fWeekdayS.format(new Date(2024, 0, 7 + i)) + "</span>";
      wk.innerHTML = h;
    }

    const t = today();
    const offset = new Date(y, m, 1).getDay();
    const count = new Date(y, m + 1, 0).getDate();
    let html = "";
    for (let i = 0; i < offset; i++) html += '<div class="cell blank" aria-hidden="true"></div>';
    for (let day = 1; day <= count; day++) {
      const d = new Date(y, m, day);
      const k = keyOf(d);
      const a = state.abasaya.shifts[k];
      const c = state.celopatera.shifts[k];
      const isToday = d.getTime() === t.getTime();
      const past = d < t;

      // Only the hospitals that actually have a shift get a slot; nothing is reserved.
      let slots = "";
      if (a) slots += '<span class="slot a"><span class="pill a ' + CLS[a] + '">' + a + '</span></span>';
      if (c) slots += '<span class="slot c"><span class="pill c ' + CLS[c] + '">' + c + '</span></span>';

      const label = fDayMonth.format(d) + (isToday ? "، النهارده" : "");
      html +=
        '<button type="button" class="cell' + (isToday ? " today" : "") + (past ? " past" : "") +
        '" data-key="' + k + '" aria-label="' + label + '">' +
          '<span class="num">' + day + '</span>' + slots +
        '</button>';
    }
    document.getElementById("days").innerHTML = html;
  }

  function renderAll() {
    document.getElementById("lgA").textContent = state.abasaya.name;
    document.getElementById("lgC").textContent = state.celopatera.name;
    renderNext();
    renderStats();
    renderCal();
  }

  /* ---------- Sheets ---------- */

  function showSheet(id) {
    document.getElementById("scrim").hidden = false;
    document.getElementById(id).hidden = false;
  }
  function closeSheets() {
    document.getElementById("scrim").hidden = true;
    document.getElementById("daySheet").hidden = true;
    document.getElementById("settingsSheet").hidden = true;
    editKey = null;
  }

  function renderDayOpts() {
    document.getElementById("dayBody").innerHTML = LOCS.map(l => {
      const cur = state[l].shifts[editKey] || "";
      const btns = OPTIONS.map(o => {
        const sw = o[0]
          ? '<span class="sw" style="background:' + SWATCH[o[0]] + '"></span>'
          : '<span class="sw" style="border:1px solid var(--faint)"></span>';
        return '<button type="button" data-loc="' + l + '" data-val="' + o[0] + '" class="' + (o[0] === cur ? "sel" : "") + '">' +
          sw + o[1] + '</button>';
      }).join("");
      return '<div class="grp"><h3>' + state[l].name + '</h3><div class="opts">' + btns + '</div></div>';
    }).join("");
  }

  function openDay(k) {
    editKey = k;
    const d = parseKey(k);
    document.getElementById("dayTitle").textContent = fWeekday.format(d) + " " + fDayMonth.format(d);
    renderDayOpts();
    showSheet("daySheet");
  }

  function openSettings() {
    document.getElementById("nameA").value = state.abasaya.name;
    document.getElementById("nameC").value = state.celopatera.name;
    setMsg("");
    showSheet("settingsSheet");
  }

  /* ---------- Events ---------- */

  document.getElementById("days").addEventListener("click", e => {
    const c = e.target.closest(".cell[data-key]");
    if (c) openDay(c.dataset.key);
  });

  document.getElementById("dayBody").addEventListener("click", e => {
    const b = e.target.closest("button[data-loc]");
    if (!b || !editKey) return;
    const l = b.dataset.loc;
    const v = b.dataset.val;
    if (v) state[l].shifts[editKey] = v;
    else delete state[l].shifts[editKey];
    save();
    renderDayOpts();
    renderAll();
  });

  document.getElementById("saveNames").addEventListener("click", () => {
    const a = document.getElementById("nameA").value.trim();
    const c = document.getElementById("nameC").value.trim();
    if (a) state.abasaya.name = a;
    if (c) state.celopatera.name = c;
    save();
    renderAll();
    setMsg("تم حفظ الأسماء.");
  });

  document.getElementById("dayDone").addEventListener("click", closeSheets);
  document.getElementById("setDone").addEventListener("click", closeSheets);
  document.getElementById("scrim").addEventListener("click", closeSheets);
  document.getElementById("openSettings").addEventListener("click", openSettings);

  document.getElementById("prev").addEventListener("click", () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1);
    renderCal();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
    renderCal();
  });

  document.getElementById("file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (typeof XLSX === "undefined") { setMsg("مكتبة قراءة الملفات ما اتحملتش. اتأكد من النت وجرب تاني."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(new Uint8Array(reader.result), { type: "array" });
        const parsed = parseWorkbook(wb);
        if (!Object.keys(parsed.abasaya).length && !Object.keys(parsed.celopatera).length) {
          setMsg("ملقتش أيام في الملف. اتأكد إنه نفس شكل الروستر.");
          return;
        }
        pending = parsed;
        setMsg("");
        showPreview(parsed);
      } catch (err) {
        setMsg("ما قدرتش أقرأ الملف. جرب Excel أو CSV تاني.");
      }
    };
    reader.onerror = () => setMsg("ما قدرتش أفتح الملف.");
    reader.readAsArrayBuffer(f);
  });

  document.getElementById("cancelUp").addEventListener("click", () => {
    pending = null;
    document.getElementById("preview").hidden = true;
  });

  document.getElementById("applyUp").addEventListener("click", () => {
    if (!pending) return;
    LOCS.forEach(l => {
      const s = summarize(pending[l]);
      if (!s.keys.length) return;
      const shifts = {};
      Object.keys(pending[l]).forEach(k => { if (pending[l][k]) shifts[k] = pending[l][k]; });
      state[l] = { name: state[l].name, period: [s.keys[0], s.keys[s.keys.length - 1]], shifts };
    });
    save();
    pending = null;
    document.getElementById("preview").hidden = true;
    const n = nextShift();
    if (n) viewMonth = new Date(n.date.getFullYear(), n.date.getMonth(), 1);
    renderAll();
    setMsg("تم تحديث الجدول.");
  });

  document.getElementById("todayBtn").addEventListener("click", () => {
    const t = today();
    viewMonth = new Date(t.getFullYear(), t.getMonth(), 1);
    renderCal();
  });

  // Initial render
  const nx = nextShift();
  const base = nx ? nx.date : today();
  viewMonth = new Date(base.getFullYear(), base.getMonth(), 1);
  renderAll();
})();
</script>
</body>
</html>
