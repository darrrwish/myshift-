<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>مهامي — Timeline</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--page:#E7EBF1;--panel:#FDFDFE;--ink:#16191F;--mu:#8A919B;--ln:#ECEDF0;--done:#B4B9C2;--donedot:#C9CED6;--sheet:#fff}
body.dark{--page:#0D0F12;--panel:#15161A;--ink:#ECEDEF;--mu:#9AA1AC;--ln:#24262B;--done:#6F757E;--donedot:#4a4e55;--sheet:#1B1C20}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
.panel{position:relative;max-width:400px;margin:0 auto;background:var(--panel);min-height:100vh;padding:26px 0 170px}
.day{display:flex;align-items:stretch}
.day+.day .dband{border-top:1px solid var(--ln)}
.dcol{flex:none;width:62px;text-align:center;padding:10px 0}
.dcol .dw{display:block;font-size:9.5px;letter-spacing:1.5px;color:var(--mu);margin-bottom:1px;font-weight:600;text-transform:uppercase}
.dcol .dn{display:block;font-size:22px;font-weight:800;line-height:1.15}
.badge{display:inline-block;background:#16191F;color:#fff;border-radius:9px;padding:5px 11px 6px;margin-bottom:2px}
body.dark .badge{background:#ECEDEF;color:#15161A}
.badge .bw{display:block;font-size:7.5px;letter-spacing:1.5px;font-weight:700;opacity:.85}
.badge .bn{display:block;font-size:19px;font-weight:800;line-height:1.1}
.tailrow .dcol{display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;min-height:110px}
.mlabel{transform:rotate(180deg);writing-mode:vertical-rl;font-size:9px;letter-spacing:3.5px;color:var(--mu);font-weight:600;text-transform:uppercase}
.dband{flex:1;padding:6px 0 10px;min-width:0}
.trow{display:flex;align-items:center;padding:9px 6px;cursor:pointer}
.ttime{flex:none;width:60px;font-size:12px;color:var(--mu);text-align:left;font-weight:500}
.tdc{flex:none;width:22px;display:flex;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;z-index:2;position:relative}
.dot.ring{width:13px;height:13px;background:var(--panel);border:3px solid #60A5FA}
.ttext{flex:1;font-size:15px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.trow.done .ttext{text-decoration:line-through;color:var(--done)}
.trow.cur .ttime,.trow.cur .ttext{font-weight:800;color:var(--ink)}
.tacts{flex:none;display:flex}
.tacts button{border:0;background:none;color:var(--mu);cursor:pointer;padding:4px 3px;display:flex;align-items:center}
.more{display:block;border:0;background:none;color:var(--mu);font-size:12px;padding:5px 10px 2px 94px;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.empty{color:var(--mu);font-size:13px;padding:16px 10px 8px 94px;line-height:1.8}
#waveSvg{position:absolute;top:0;bottom:0;width:26px;z-index:1;pointer-events:none}
.icn{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.floaty{position:fixed;bottom:16px;left:0;right:0;max-width:400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 14px;pointer-events:none;z-index:5;transition:bottom .22s ease}
body.composer-open .floaty{bottom:76px}
.pill-bar{pointer-events:auto;display:flex;gap:2px;background:var(--sheet);border-radius:99px;padding:6px 9px;box-shadow:0 6px 18px rgba(20,24,31,.12)}
body.dark .pill-bar{box-shadow:0 6px 18px rgba(0,0,0,.5)}
.pill-bar button{border:0;background:none;padding:7px 8px;cursor:pointer;color:#6B7280;display:flex;align-items:center}
.pill-bar .icn{width:17px;height:17px}
.fab{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:var(--sheet);color:var(--ink);cursor:pointer;box-shadow:0 6px 18px rgba(20,24,31,.10);display:flex;align-items:center;justify-content:center}
.fab .icn{width:22px;height:22px}
#composer{position:fixed;bottom:0;left:0;right:0;max-width:400px;margin:0 auto;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--ln);z-index:6;transition:transform .22s ease}
body:not(.composer-open) #composer{transform:translateY(110%);pointer-events:none}
#tin{flex:1;border:1px solid var(--ln);background:var(--page);color:var(--ink);border-radius:99px;padding:12px 16px;font-size:15px;font-family:inherit;outline:none;min-width:0}
#tin:focus{border-color:var(--mu)}
#sendBtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#16191F;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sendBtn .icn{width:18px;height:18px}
body.dark #sendBtn{background:#ECEDEF;color:#15161A}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:11;max-width:400px;margin:0 auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet h2{font-size:16px;margin:4px 0 8px}
.sheet .flabel{display:block;font-size:12px;color:var(--mu);margin:10px 0 5px}
.sheet input,.sheet textarea{width:100%;border:1px solid var(--ln);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
.sheet .r2{display:flex;gap:8px;margin-top:14px}
.sheet .btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--ln);background:var(--panel);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.sheet .btn.pri{background:#16191F;color:#fff;border:0}
body.dark .sheet .btn.pri{background:#ECEDEF;color:#15161A}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
#toast{position:fixed;bottom:140px;inset-inline:0;text-align:center;z-index:20;pointer-events:none}
#toast span{background:#16191F;color:#fff;font-size:13px;padding:8px 18px;border-radius:99px}
body.dark #toast span{background:#ECEDEF;color:#15161A}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div id="days"></div>
  <svg id="waveSvg" preserveAspectRatio="none"></svg>
</div>
<div class="floaty">
  <div class="pill-bar"><button id="todayBtn" type="button" aria-label="Today"></button><button id="darkBtn" type="button" aria-label="Dark mode"></button></div>
  <button class="fab" id="fab" type="button" aria-label="Add task"></button>
</div>
<form id="composer" autocomplete="off">
  <input id="tin" type="text" dir="auto" placeholder="Type a task and send it..." aria-label="New task">
  <button id="sendBtn" type="submit" aria-label="Send"></button>
</form>
<div class="sheet" id="editSheet" role="dialog" aria-modal="true" hidden>
  <h2>Edit task</h2>
  <span class="flabel">Task</span>
  <textarea id="eText" rows="3" dir="auto"></textarea>
  <span class="flabel">Day</span>
  <input id="eDate" type="date">
  <span class="flabel">Time</span>
  <input id="eTime" type="time">
  <div class="r2"><button class="btn" id="eCancel" type="button">Cancel</button><button class="btn pri" id="eSave" type="button">Save</button></div>
</div>
<div id="scrim" hidden></div>
<div id="toast" hidden><span></span></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fW=new Intl.DateTimeFormat("en-US",{weekday:"short"});
const fMY=new Intl.DateTimeFormat("en-US",{month:"long",year:"numeric"});
const fT=new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
const ARN="٠١٢٣٤٥٦٧٨٩";
const arDig=s=>String(s).replace(/[٠-٩]/g,c=>String(ARN.indexOf(c)));
const PALETTE=["#F87171","#60A5FA","#A78BFA","#14B8A6","#FB923C"];
const colorFor=id=>{let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return PALETTE[h%PALETTE.length]};
const I={
edit:'<svg class="icn" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
trash:'<svg class="icn" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>',
grid:'<svg class="icn" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
moon:'<svg class="icn" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
plus:'<svg class="icn" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
up:'<svg class="icn" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'};
$("todayBtn").innerHTML=I.grid;$("darkBtn").innerHTML=I.moon;$("fab").innerHTML=I.plus;$("sendBtn").innerHTML=I.up;

const KEY="todoline-v1";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
state.items=state.items||[];
if(state.dark==null)state.dark=matchMedia("(prefers-color-scheme: dark)").matches;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
if(state.dark)document.body.classList.add("dark");

/* parse "بكرة"/"بعد بكرة" and a time like "5:30 م" or "الساعة ٧ ص" out of the text */
function parseMsg(raw){
  let text=raw.trim(),day=keyOf(today()),time=null;
  let m=text.match(/بعد\s*بكرة/);if(m){const d=today();d.setDate(d.getDate()+2);day=keyOf(d);text=text.replace(m[0]," ")}
  else{m=text.match(/بكرة|بكره/);if(m){const d=today();d.setDate(d.getDate()+1);day=keyOf(d);text=text.replace(m[0]," ")}}
  m=text.match(/الساعة\s*([0-9٠-٩]{1,2})(?:[:٫.]([0-9٠-٩]{1,2}))?\s*(صباحا|ص|مساء|م)?/);
  if(!m)m=text.match(/(?:^|\s)([0-9٠-٩]{1,2})[:٫.]([0-9٠-٩]{1,2})\s*(صباحا|ص|مساء|م)?(?:\s|$)/);
  if(m){
    let h=+arDig(m[1]),min=m[2]?+arDig(m[2]):0;const ap=m[3]||"";
    if((ap==="م"||ap==="مساء")&&h<12)h+=12;
    if((ap==="ص"||ap==="صباحا")&&h===12)h=0;
    if(h>=0&&h<24&&min>=0&&min<60){time=pad(h)+":"+pad(min);text=text.replace(m[0]," ")}
  }
  text=text.replace(/\s+/g," ").trim();
  return{text,day,time};
}
const nowTime=()=>{const n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes())};

let expanded={};
function daysWithItems(){
  const map={};
  state.items.forEach(i=>{(map[i.day]=map[i.day]||[]).push(i)});
  const tk=keyOf(today());
  if(!map[tk])map[tk]=[];
  return Object.keys(map).sort().map(k=>({day:k,items:map[k].sort((a,b)=>(a.time||"")<(b.time||"")?-1:1)}));
}
function currentId(){
  const tk=keyOf(today()),now=nowTime();
  const t=state.items.filter(i=>i.day===tk&&!i.done).sort((a,b)=>(a.time||"")<(b.time||"")?-1:1);
  if(!t.length)return null;
  const past=t.filter(i=>(i.time||"99")<=now);
  return (past.length?past[past.length-1]:t[0]).id;
}
function render(){
  const days=daysWithItems(),tk=keyOf(today()),cur=currentId();
  let html="";
  days.forEach(g=>{
    const d=parseKey(g.day),isT=g.day===tk;
    html+='<div class="day" id="day-'+g.day+'"><div class="dcol">'
      +(isT?'<span class="badge"><span class="bw">TODAY</span><span class="bn">'+d.getDate()+"</span></span>"
           :'<span class="dw">'+esc(fW.format(d))+'</span><span class="dn">'+d.getDate()+"</span>")
      +'</div><div class="dband">';
    const lim=expanded[g.day]?g.items.length:5;
    g.items.slice(0,lim).forEach(i=>{
      html+='<div class="trow'+(i.done?" done":"")+(i.id===cur?" cur":"")+'" data-tid="'+i.id+'">'
        +'<span class="ttime">'+(i.time?esc(fmtTime(i.time)):"")+'</span>'
        +'<span class="tdc"><span class="dot'+(i.id===cur?" ring":"")+'"'+(i.id===cur?"":' style="background:'+(i.done?"var(--donedot)":colorFor(i.id))+'"')+'></span></span>'
        +'<span class="ttext" dir="auto">'+esc(i.text)+"</span>"
        +'<span class="tacts"><button type="button" data-te="'+i.id+'" aria-label="Edit">'+I.edit+'</button><button type="button" data-td="'+i.id+'" aria-label="Delete">'+I.trash+'</button></span></div>';
    });
    if(g.items.length>lim)html+='<button type="button" class="more" data-mx="'+g.day+'">+ '+(g.items.length-lim)+" more</button>";
    if(!g.items.length&&isT)html+='<div class="empty">No tasks today. Tap + to add your first one.</div>';
    html+="</div></div>";
  });
  html+='<div class="day tailrow"><div class="dcol"><span class="mlabel">'+esc(fMY.format(today()).toUpperCase())+'</span></div><div class="dband"></div></div>';
  $("days").innerHTML=html;
  layoutWave();
}
function fmtTime(t){
  const p=t.split(":"),d=new Date();d.setHours(+p[0],+p[1],0,0);return fT.format(d);
}
/* one wavy line; every dot is translated onto the curve so it sits exactly on it */
const WAVEF=y=>7*Math.sin(y/60);
function layoutWave(){
  requestAnimationFrame(()=>{
    const panel=$("panel"),svg=$("waveSvg"),tk=keyOf(today());
    const pr=panel.getBoundingClientRect();
    const cells=[...panel.querySelectorAll(".tdc")];
    if(!cells.length){svg.innerHTML="";return}
    cells.forEach(c=>c.style.transform="");
    const r0=cells[0].getBoundingClientRect();
    const baseCx=r0.left-pr.left+r0.width/2;
    cells.forEach(c=>{
      const r=c.getBoundingClientRect();
      const y=r.top-pr.top+r.height/2;
      c.style.transform="translateX("+WAVEF(y).toFixed(1)+"px)";
    });
    svg.style.left=(baseCx-13)+"px";
    const H=panel.offsetHeight;
    svg.setAttribute("viewBox","0 0 26 "+H);
    const wx=y=>13+WAVEF(y);
    const todayEl=$("day-"+tk);
    let yS0=0,yS1=0;
    if(todayEl){
      const rt=todayEl.getBoundingClientRect();
      yS0=Math.max(0,rt.top-pr.top);
      const more=todayEl.querySelector(".more");
      const rb=(more||todayEl).getBoundingClientRect();
      yS1=rb.bottom-pr.top-(more?28:0)+16;
    }
    const path=(a,b)=>{let d="M "+wx(a).toFixed(1)+" "+a.toFixed(1);for(let y=a+12;y<=b;y+=12)d+=" L "+wx(y).toFixed(1)+" "+y;return d};
    let inner='<defs><linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" y1="'+yS0+'" x2="0" y2="'+Math.max(yS1,yS0+1)+'">'
      +'<stop offset="0" stop-color="#EF4444"/><stop offset=".5" stop-color="#14B8A6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>';
    if(yS0>10)inner+='<path d="'+path(-6,yS0)+'" stroke="var(--donedot)" stroke-width="2" fill="none" stroke-dasharray="2.5 6" stroke-linecap="round"/>';
    if(yS1>yS0)inner+='<path d="'+path(yS0,yS1)+'" stroke="url(#wg)" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    inner+='<path d="'+path(yS1+10,H-120)+'" stroke="var(--donedot)" stroke-width="2" fill="none" stroke-dasharray="2.5 6" stroke-linecap="round"/>';
    svg.innerHTML=inner;
  });
}
function scrollToday(){const el=$("day-"+keyOf(today()));if(el)el.scrollIntoView({block:"start"})}

const openComposer=()=>{document.body.classList.add("composer-open");$("tin").focus()};
const closeComposer=()=>{document.body.classList.remove("composer-open")};
$("fab").addEventListener("click",()=>{document.body.classList.contains("composer-open")?$("tin").focus():openComposer()});
document.addEventListener("click",e=>{
  if(!document.body.classList.contains("composer-open"))return;
  if(e.target.closest("#composer")||e.target.closest("#fab")||e.target.closest(".sheet"))return;
  closeComposer();
});

$("composer").addEventListener("submit",e=>{
  e.preventDefault();
  const raw=$("tin").value;if(!raw.trim())return;
  const p=parseMsg(raw);
  if(!p.text){$("tin").value="";return}
  state.items.push({id:nid(),text:p.text,day:p.day,time:p.time||nowTime(),ts:Date.now(),done:false});
  save();$("tin").value="";expanded[p.day]=true;render();
  const el=$("day-"+p.day);if(el)el.scrollIntoView({block:"center"});
});
$("days").addEventListener("click",e=>{
  const mx=e.target.closest("[data-mx]");if(mx){expanded[mx.dataset.mx]=true;render();return}
  const ed=e.target.closest("[data-te]");if(ed){openEdit(ed.dataset.te);return}
  const dl=e.target.closest("[data-td]");
  if(dl){
    const it=state.items.find(x=>x.id===dl.dataset.td);if(!it)return;
    if(!confirm("Delete this task for good?"))return;
    state.items=state.items.filter(x=>x.id!==it.id);save();render();toast("Deleted");return;
  }
  const row=e.target.closest("[data-tid]");
  if(row){
    const it=state.items.find(x=>x.id===row.dataset.tid);if(!it)return;
    it.done=!it.done;save();render();
  }
});
let editId="";
function openEdit(id){
  const it=state.items.find(x=>x.id===id);if(!it)return;
  editId=id;$("eText").value=it.text;$("eDate").value=it.day;$("eTime").value=it.time||"";
  $("editSheet").hidden=false;$("scrim").hidden=false;
}
function closeEdit(){$("editSheet").hidden=true;$("scrim").hidden=true;editId=""}
$("eCancel").addEventListener("click",closeEdit);
$("scrim").addEventListener("click",closeEdit);
$("eSave").addEventListener("click",()=>{
  const it=state.items.find(x=>x.id===editId);if(!it){closeEdit();return}
  const t=$("eText").value.trim();if(!t)return;
  it.text=t;it.day=$("eDate").value||it.day;it.time=$("eTime").value||"";
  save();closeEdit();render();toast("Saved");
});
let toastT=null;
function toast(m){$("toast").hidden=false;$("toast").querySelector("span").textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>$("toast").hidden=true,1800)}
$("darkBtn").addEventListener("click",()=>{state.dark=!state.dark;document.body.classList.toggle("dark",state.dark);save()});
$("todayBtn").addEventListener("click",scrollToday);
addEventListener("resize",layoutWave);
if(location.protocol.startsWith("http")&&navigator.serviceWorker)navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();scrollToday();
</script>
</body>
</html>
